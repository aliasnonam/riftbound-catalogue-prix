// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.9+ is required to compile against Android 16 / API 36.
        classpath 'com.android.tools.build:gradle:8.9.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 7.4.x defaults its Android library module to Build-Tools 35.
// Keep every Android module on the installed API 36 toolchain instead.
subprojects { subproject ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.extensions.getByName('android').buildToolsVersion = '36.0.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
